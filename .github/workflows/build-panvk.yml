name: Build PanVK Mali (Dimensity 7030 / kbase patch)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install host build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            meson ninja-build pkg-config glslang-tools \
            python3-mako python3-packaging python3-yaml \
            clang llvm-dev libclang-dev libclc-18-dev libllvmspirvlib-18-dev \
            bison flex patchelf zip unzip curl
          if [ "$(meson --version | cut -d. -f2)" -lt 4 ]; then
            pip3 install --break-system-packages --upgrade "meson>=1.4.0"
          fi

      - name: Setup Android NDK r29
        id: setup-ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r29
          add-to-path: false

      - name: Patch CSF kbase ioctls, scoreboard mask, exec BOs & sync wait for Mali-G610 / Dimensity 7030
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path("src/panfrost/lib/kmod/kbase_kmod.c")
          src = p.read_text()

          # 1. Fallback para CS_TILER_HEAP_INIT (24B -> 16B)
          old_ioctl = (
              "#define KBASE_IOCTL_CS_TILER_HEAP_INIT                                                            \\\n"
              "   _IOWR(KBASE_IOCTL_TYPE, 48, union kbase_ioctl_cs_tiler_heap_init)"
          )
          new_ioctl = (
              "union kbase_ioctl_cs_tiler_heap_init_v1_13 {\n"
              "   struct {\n"
              "      uint32_t chunk_size;\n"
              "      uint32_t initial_chunks;\n"
              "      uint32_t max_chunks;\n"
              "      uint16_t target_in_flight;\n"
              "      uint8_t group_id;\n"
              "      uint8_t padding;\n"
              "   } in;\n"
              "   struct {\n"
              "      uint64_t gpu_heap_va;\n"
              "      uint64_t first_chunk_va;\n"
              "   } out;\n"
              "};\n\n"
              "#define KBASE_IOCTL_CS_TILER_HEAP_INIT_V1_13                                                      \\\n"
              "   _IOWR(KBASE_IOCTL_TYPE, 48, union kbase_ioctl_cs_tiler_heap_init_v1_13)\n\n"
              + old_ioctl
          )
          assert old_ioctl in src, "Expected KBASE_IOCTL_CS_TILER_HEAP_INIT block not found"
          src = src.replace(old_ioctl, new_ioctl, 1)

          old_func = (
              "   if (pan_kmod_ioctl(dev->fd, KBASE_IOCTL_CS_TILER_HEAP_INIT, &req)) {\n"
              '      mesa_loge("kbase: CS_TILER_HEAP_INIT failed (err=%d)", errno);\n'
              "      return false;\n"
              "   }\n"
              "   *heap_ctx_va = req.out.gpu_heap_va;\n"
              "   *first_chunk_va = req.out.first_chunk_va;"
          )
          new_func = (
              "   if (pan_kmod_ioctl(dev->fd, KBASE_IOCTL_CS_TILER_HEAP_INIT, &req)) {\n"
              "      if (errno == ENOTTY) {\n"
              "         union kbase_ioctl_cs_tiler_heap_init_v1_13 req_legacy = {\n"
              "            .in = {\n"
              "               .chunk_size = chunk_size,\n"
              "               .initial_chunks = initial_chunks,\n"
              "               .max_chunks = max_chunks,\n"
              "               .target_in_flight = target_in_flight,\n"
              "            },\n"
              "         };\n"
              "         if (pan_kmod_ioctl(dev->fd, KBASE_IOCTL_CS_TILER_HEAP_INIT_V1_13, &req_legacy)) {\n"
              '            mesa_loge("kbase: CS_TILER_HEAP_INIT (legacy) failed (err=%d)", errno);\n'
              "            return false;\n"
              "         }\n"
              "         *heap_ctx_va = req_legacy.out.gpu_heap_va;\n"
              "         *first_chunk_va = req_legacy.out.first_chunk_va;\n"
              "         return true;\n"
              "      }\n"
              '      mesa_loge("kbase: CS_TILER_HEAP_INIT failed (err=%d)", errno);\n'
              "      return false;\n"
              "   }\n"
              "   *heap_ctx_va = req.out.gpu_heap_va;\n"
              "   *first_chunk_va = req.out.first_chunk_va;"
          )
          assert old_func in src, "Expected CS_TILER_HEAP_INIT call block not found"
          src = src.replace(old_func, new_func, 1)

          # 2. Fallback para CS_QUEUE_GROUP_CREATE (112B ioctl 58 -> 40B ioctl 58 -> 32B ioctl 42)
          old_gc_ioctl = (
              "#define KBASE_IOCTL_CS_QUEUE_GROUP_CREATE                                                         \\\n"
              "   _IOWR(KBASE_IOCTL_TYPE, 58, union kbase_ioctl_cs_queue_group_create)"
          )
          new_gc_ioctl = (
              "union kbase_ioctl_cs_queue_group_create_v40 {\n"
              "   struct {\n"
              "      uint64_t tiler_mask;\n"
              "      uint64_t fragment_mask;\n"
              "      uint64_t compute_mask;\n"
              "      uint8_t cs_min;\n"
              "      uint8_t priority;\n"
              "      uint8_t tiler_max;\n"
              "      uint8_t fragment_max;\n"
              "      uint8_t compute_max;\n"
              "      uint8_t csi_handlers;\n"
              "      uint8_t padding[2];\n"
              "      uint64_t reserved;\n"
              "   } in;\n"
              "   struct {\n"
              "      uint8_t group_handle;\n"
              "      uint8_t padding[3];\n"
              "      uint32_t group_uid;\n"
              "   } out;\n"
              "};\n\n"
              "union kbase_ioctl_cs_queue_group_create_1_6 {\n"
              "   struct {\n"
              "      uint64_t tiler_mask;\n"
              "      uint64_t fragment_mask;\n"
              "      uint64_t compute_mask;\n"
              "      uint8_t cs_min;\n"
              "      uint8_t priority;\n"
              "      uint8_t tiler_max;\n"
              "      uint8_t fragment_max;\n"
              "      uint8_t compute_max;\n"
              "      uint8_t padding[3];\n"
              "   } in;\n"
              "   struct {\n"
              "      uint8_t group_handle;\n"
              "      uint8_t padding[3];\n"
              "      uint32_t group_uid;\n"
              "   } out;\n"
              "};\n\n"
              "#define KBASE_IOCTL_CS_QUEUE_GROUP_CREATE_V40                                                     \\\n"
              "   _IOWR(KBASE_IOCTL_TYPE, 58, union kbase_ioctl_cs_queue_group_create_v40)\n"
              "#define KBASE_IOCTL_CS_QUEUE_GROUP_CREATE_1_6                                                     \\\n"
              "   _IOWR(KBASE_IOCTL_TYPE, 42, union kbase_ioctl_cs_queue_group_create_1_6)\n\n"
              + old_gc_ioctl
          )
          assert old_gc_ioctl in src, "Expected KBASE_IOCTL_CS_QUEUE_GROUP_CREATE block not found"
          src = src.replace(old_gc_ioctl, new_gc_ioctl, 1)

          old_gc_call = (
              "   if (pan_kmod_ioctl(dev->fd, KBASE_IOCTL_CS_QUEUE_GROUP_CREATE, &gc)) {\n"
              '      mesa_loge("kbase: CS_QUEUE_GROUP_CREATE failed (err=%d)", errno);\n'
              "      goto err_free_seq;\n"
              "   }\n"
              "   g->handle = gc.out.group_handle;"
          )
          new_gc_call = (
              "   uint8_t group_handle = 0;\n"
              "   if (pan_kmod_ioctl(dev->fd, KBASE_IOCTL_CS_QUEUE_GROUP_CREATE, &gc)) {\n"
              "      if (errno == ENOTTY) {\n"
              "         union kbase_ioctl_cs_queue_group_create_v40 gc40 = {\n"
              "            .in = {\n"
              "               .tiler_mask = 1,\n"
              "               .fragment_mask = fragment_mask,\n"
              "               .compute_mask = compute_mask,\n"
              "               .cs_min = nr_queues,\n"
              "               .priority = priority,\n"
              "               .tiler_max = 1,\n"
              "               .fragment_max = max_fragment,\n"
              "               .compute_max = max_compute,\n"
              "            },\n"
              "         };\n"
              "         union kbase_ioctl_cs_queue_group_create_1_6 gc32 = {\n"
              "            .in = {\n"
              "               .tiler_mask = 1,\n"
              "               .fragment_mask = fragment_mask,\n"
              "               .compute_mask = compute_mask,\n"
              "               .cs_min = nr_queues,\n"
              "               .priority = priority,\n"
              "               .tiler_max = 1,\n"
              "               .fragment_max = max_fragment,\n"
              "               .compute_max = max_compute,\n"
              "            },\n"
              "         };\n"
              "         if (!pan_kmod_ioctl(dev->fd, KBASE_IOCTL_CS_QUEUE_GROUP_CREATE_V40, &gc40)) {\n"
              "            group_handle = gc40.out.group_handle;\n"
              "         } else if (errno == ENOTTY && !pan_kmod_ioctl(dev->fd, KBASE_IOCTL_CS_QUEUE_GROUP_CREATE_1_6, &gc32)) {\n"
              "            group_handle = gc32.out.group_handle;\n"
              "         } else {\n"
              '            mesa_loge("kbase: CS_QUEUE_GROUP_CREATE (fallback) failed (err=%d)", errno);\n'
              "            goto err_free_seq;\n"
              "         }\n"
              "      } else {\n"
              '         mesa_loge("kbase: CS_QUEUE_GROUP_CREATE failed (err=%d)", errno);\n'
              "         goto err_free_seq;\n"
              "      }\n"
              "   } else {\n"
              "      group_handle = gc.out.group_handle;\n"
              "   }\n"
              "   g->handle = group_handle;"
          )
          assert old_gc_call in src, "Expected CS_QUEUE_GROUP_CREATE call block not found"
          src = src.replace(old_gc_call, new_gc_call, 1)

          # 3. Máscara real de scoreboards (8 slots = 0xff en G610, 16 slots = 0xffff en G720)
          old_sb = (
              "      kbase_csf_emit(r, cs_ins(CS_OP_MOVE32, V << 48));\n"
              "      kbase_csf_emit(r, cs_ins(CS_OP_FLUSH_CACHE2,\n"
              "                               (V << 40) | (0xffffull << 16) | (1u << 4) | 1u)); /* clean */\n"
              "      kbase_csf_emit(r, cs_ins(CS_OP_WAIT, 0xffffull << 16));"
          )
          new_sb = (
              "      const uint64_t sb_all = BITFIELD_MASK(MIN2(kdev->csif.scoreboard_slot_count, 16));\n"
              "      kbase_csf_emit(r, cs_ins(CS_OP_MOVE32, V << 48));\n"
              "      kbase_csf_emit(r, cs_ins(CS_OP_FLUSH_CACHE2,\n"
              "                               (V << 40) | (sb_all << 16) | (1u << 4) | 1u)); /* clean */\n"
              "      kbase_csf_emit(r, cs_ins(CS_OP_WAIT, sb_all << 16));"
          )
          assert old_sb in src, "Expected scoreboard wait mask block not found"
          src = src.replace(old_sb, new_sb, 1)

          # 4a. MEM_EXEC_INIT antes de MEM_JIT_INIT en contexto CSF
          old_exec_init = (
              "      if (vc.major == 1) {\n"
              "         struct kbase_ioctl_mem_jit_init jit = {\n"
              "            .va_pages = KBASE_CSF_JIT_VA_PAGES,\n"
              "            .max_allocations = 255,\n"
              "            .phys_pages = KBASE_CSF_JIT_VA_PAGES,\n"
              "         };\n"
              "         if (pan_kmod_ioctl(fd, KBASE_IOCTL_MEM_JIT_INIT, &jit))\n"
              '            mesa_logw("kbase: MEM_JIT_INIT failed (err=%d); no tiler heap", errno);\n'
              "      }\n"
              "      if (pan_kmod_ioctl(fd, KBASE_IOCTL_MEM_EXEC_INIT, &ei))\n"
              '         mesa_logw("kbase: MEM_EXEC_INIT failed (err=%d); executable BOs will be SAME_VA", errno);'
          )
          new_exec_init = (
              "      if (pan_kmod_ioctl(fd, KBASE_IOCTL_MEM_EXEC_INIT, &ei))\n"
              '         mesa_logw("kbase: MEM_EXEC_INIT failed (err=%d); executable BOs will be SAME_VA", errno);\n'
              "      if (vc.major == 1) {\n"
              "         struct kbase_ioctl_mem_jit_init jit = {\n"
              "            .va_pages = KBASE_CSF_JIT_VA_PAGES,\n"
              "            .max_allocations = 255,\n"
              "            .phys_pages = KBASE_CSF_JIT_VA_PAGES,\n"
              "         };\n"
              "         if (pan_kmod_ioctl(fd, KBASE_IOCTL_MEM_JIT_INIT, &jit))\n"
              '            mesa_logw("kbase: MEM_JIT_INIT failed (err=%d); no tiler heap", errno);\n'
              "      }"
          )
          assert old_exec_init in src, "Expected MEM_EXEC_INIT block not found"
          src = src.replace(old_exec_init, new_exec_init, 1)

          # 4b. Si el kernel degrada un BO ejecutable a SAME_VA (BASE_MEM_NEED_MMAP), mapear su anchor
          old_bo_exec = (
              "   bo->exec = exec;\n"
              "   bo->anchor = NULL;\n\n"
              "   if (exec) {"
          )
          new_bo_exec = (
              "   const bool need_mmap = (req.out.flags & BASE_MEM_NEED_MMAP) != 0;\n"
              "   bo->exec = exec && !need_mmap;\n"
              "   bo->anchor = NULL;\n\n"
              "   if (bo->exec) {"
          )
          assert old_bo_exec in src, "Expected kbase_kmod_bo_alloc exec block not found"
          src = src.replace(old_bo_exec, new_bo_exec, 1)

          # 5a. Conservar csf_group/csf_seq en ks_transfer y esperar por el hilo CSF en ks_export_sync_file
          old_ks_transfer = (
              "   if (d && s && d != s) {\n"
              "      ks_set_state(d, s->state, s->fd >= 0 ? dup(s->fd) : -1);\n"
              "      d->external = s->external;\n"
              "      pthread_cond_broadcast(&ks_cond);\n"
              "   }"
          )
          new_ks_transfer = (
              "   if (d && s && d != s) {\n"
              "      ks_set_state(d, s->state, s->fd >= 0 ? dup(s->fd) : -1);\n"
              "      d->external = s->external;\n"
              "      d->csf_group = s->csf_group;\n"
              "      d->csf_seq = s->csf_seq;\n"
              "      pthread_cond_broadcast(&ks_cond);\n"
              "   }"
          )
          assert old_ks_transfer in src, "Expected ks_transfer block not found"
          src = src.replace(old_ks_transfer, new_ks_transfer, 1)

          old_ks_export = (
              "      if (o->fd >= 0) {\n"
              "         /* The GPU is still at it: hand out the fence-trigger sync file. */\n"
              "         *out_fd = dup(o->fd);\n"
              "         pthread_mutex_unlock(&ks_lock);\n"
              "         return *out_fd >= 0 ? 0 : ks_ret(-errno);\n"
              "      }\n"
              "      /* Submitted without a sync file: all that is left is to wait for the GPU. */\n"
              "      ret = ks_wait_locked(&handle, 1, deadline, 0, NULL);"
          )
          new_ks_export = (
              "      if (o->fd >= 0) {\n"
              "         /* The GPU is still at it: hand out the fence-trigger sync file. */\n"
              "         *out_fd = dup(o->fd);\n"
              "         pthread_mutex_unlock(&ks_lock);\n"
              "         return *out_fd >= 0 ? 0 : ks_ret(-errno);\n"
              "      }\n"
              "      if (!o->external && o->csf_group && o->csf_seq) {\n"
              "         struct pan_kmod_kbase_csf_group *csf_g =\n"
              "            (struct pan_kmod_kbase_csf_group *)o->csf_group;\n"
              "         const uint64_t csf_seq = o->csf_seq;\n"
              "         pthread_mutex_unlock(&ks_lock);\n"
              "         if (!pan_kmod_kbase_csf_wait(csf_g, csf_seq, (int64_t)deadline)) {\n"
              '            mesa_loge("kbase: sync file export CSF wait timed out (seq %" PRIu64 ")", csf_seq);\n'
              "            return ks_ret(-ETIME);\n"
              "         }\n"
              "         *out_fd = -1;\n"
              "         return 0;\n"
              "      }\n"
              "      /* Submitted without a sync file: all that is left is to wait for the GPU. */\n"
              "      ret = ks_wait_locked(&handle, 1, deadline, 0, NULL);"
          )
          assert old_ks_export in src, "Expected ks_export_sync_file block not found"
          src = src.replace(old_ks_export, new_ks_export, 1)

          # 5b. Watchdog de diagnostico cada 5s si una espera infinita (INT64_MAX) se queda colgada
          old_ks_wait = (
              "   const bool all = flags & DRM_SYNCOBJ_WAIT_FLAGS_WAIT_ALL;\n"
              "   const bool available = flags & DRM_SYNCOBJ_WAIT_FLAGS_WAIT_AVAILABLE;\n\n"
              "   for (;;) {"
          )
          new_ks_wait = (
              "   const bool all = flags & DRM_SYNCOBJ_WAIT_FLAGS_WAIT_ALL;\n"
              "   const bool available = flags & DRM_SYNCOBJ_WAIT_FLAGS_WAIT_AVAILABLE;\n"
              "   uint64_t next_log = timeout_nsec == INT64_MAX ? ks_now() + 5000000000ull : 0;\n\n"
              "   for (;;) {"
          )
          assert old_ks_wait in src, "Expected ks_wait_locked head not found"
          src = src.replace(old_ks_wait, new_ks_wait, 1)

          old_ks_wait_sleep = (
              "      if (external) {\n"
              "         /* An imported sync file signals without telling anyone: look again in a millisecond. */\n"
              "         const uint64_t next = MIN2((uint64_t)timeout_nsec, ks_now() + 1000000ull);\n"
              "         const struct timespec ts = {.tv_sec = next / 1000000000ull, .tv_nsec = next % 1000000000ull};\n"
              "         pthread_cond_timedwait(&ks_cond, &ks_lock, &ts);\n"
              "      } else if (timeout_nsec == INT64_MAX) {\n"
              "         pthread_cond_wait(&ks_cond, &ks_lock);\n"
              "      }"
          )
          new_ks_wait_sleep = (
              "      if (timeout_nsec == INT64_MAX && ks_now() >= next_log) {\n"
              "         struct ks_obj *o0 = n ? ks_get(handles[0]) : NULL;\n"
              '         mesa_loge("kbase ks_wait >5s: n=%u done=%u flags=0x%x o0(state=%u ext=%d fd=%d seq=%" PRIu64 ")",\n'
              "                   n, done, flags, o0 ? (unsigned)o0->state : 255u,\n"
              "                   o0 ? (int)o0->external : 0, o0 ? o0->fd : -1,\n"
              "                   o0 ? o0->csf_seq : (uint64_t)0);\n"
              "         next_log = ks_now() + 5000000000ull;\n"
              "      }\n"
              "      if (external) {\n"
              "         /* An imported sync file signals without telling anyone: look again in a millisecond. */\n"
              "         const uint64_t next = MIN2((uint64_t)timeout_nsec, ks_now() + 1000000ull);\n"
              "         const struct timespec ts = {.tv_sec = next / 1000000000ull, .tv_nsec = next % 1000000000ull};\n"
              "         pthread_cond_timedwait(&ks_cond, &ks_lock, &ts);\n"
              "      } else if (timeout_nsec == INT64_MAX) {\n"
              "         const struct timespec ts = {.tv_sec = next_log / 1000000000ull,\n"
              "                                     .tv_nsec = next_log % 1000000000ull};\n"
              "         pthread_cond_timedwait(&ks_cond, &ks_lock, &ts);\n"
              "      }"
          )
          assert old_ks_wait_sleep in src, "Expected ks_wait_locked sleep block not found"
          src = src.replace(old_ks_wait_sleep, new_ks_wait_sleep, 1)

          old_csf_wait = (
              "bool\n"
              "pan_kmod_kbase_csf_wait(struct pan_kmod_kbase_csf_group *g, uint64_t seq, int64_t abs_timeout_ns)\n"
              "{\n"
              "   struct kbase_csf_dev *c = g->kdev->csfq;\n"
              "   bool done = false;\n\n"
              "   pthread_mutex_lock(&c->lock);\n"
              "   if (!seq)\n"
              "      seq = g->next_seq - 1;\n"
              "   for (;;) {\n"
              "      if (g->done_seq >= seq) {\n"
              "         done = true;\n"
              "         break;\n"
              "      }\n"
              "      if (abs_ti

name: Build PanVK Mali (Dimensity 7030 / kbase patch)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install host build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            meson ninja-build pkg-config glslang-tools \
            python3-mako python3-packaging python3-yaml \
            clang llvm-dev libclang-dev libclc-18-dev libllvmspirvlib-18-dev \
            bison flex patchelf zip unzip curl
          if [ "$(meson --version | cut -d. -f2)" -lt 4 ]; then
            pip3 install --break-system-packages --upgrade "meson>=1.4.0"
          fi

      - name: Setup Android NDK r29
        id: setup-ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r29
          add-to-path: false

      - name: Patch CSF kbase ioctls & scoreboard mask for Mali-G610 / Dimensity 7030
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path("src/panfrost/lib/kmod/kbase_kmod.c")
          src = p.read_text()

          # 1. Fallback para CS_TILER_HEAP_INIT (24B -> 16B)
          old_ioctl = (
              "#define KBASE_IOCTL_CS_TILER_HEAP_INIT                                                            \\\n"
              "   _IOWR(KBASE_IOCTL_TYPE, 48, union kbase_ioctl_cs_tiler_heap_init)"
          )
          new_ioctl = (
              "union kbase_ioctl_cs_tiler_heap_init_v1_13 {\n"
              "   struct {\n"
              "      uint32_t chunk_size;\n"
              "      uint32_t initial_chunks;\n"
              "      uint32_t max_chunks;\n"
              "      uint16_t target_in_flight;\n"
              "      uint8_t group_id;\n"
              "      uint8_t padding;\n"
              "   } in;\n"
              "   struct {\n"
              "      uint64_t gpu_heap_va;\n"
              "      uint64_t first_chunk_va;\n"
              "   } out;\n"
              "};\n\n"
              "#define KBASE_IOCTL_CS_TILER_HEAP_INIT_V1_13                                                      \\\n"
              "   _IOWR(KBASE_IOCTL_TYPE, 48, union kbase_ioctl_cs_tiler_heap_init_v1_13)\n\n"
              + old_ioctl
          )
          assert old_ioctl in src, "Expected KBASE_IOCTL_CS_TILER_HEAP_INIT block not found"
          src = src.replace(old_ioctl, new_ioctl, 1)

          old_func = (
              "   if (pan_kmod_ioctl(dev->fd, KBASE_IOCTL_CS_TILER_HEAP_INIT, &req)) {\n"
              '      mesa_loge("kbase: CS_TILER_HEAP_INIT failed (err=%d)", errno);\n'
              "      return false;\n"
              "   }\n"
              "   *heap_ctx_va = req.out.gpu_heap_va;\n"
              "   *first_chunk_va = req.out.first_chunk_va;"
          )
          new_func = (
              "   if (pan_kmod_ioctl(dev->fd, KBASE_IOCTL_CS_TILER_HEAP_INIT, &req)) {\n"
              "      if (errno == ENOTTY) {\n"
              "         union kbase_ioctl_cs_tiler_heap_init_v1_13 req_legacy = {\n"
              "            .in = {\n"
              "               .chunk_size = chunk_size,\n"
              "               .initial_chunks = initial_chunks,\n"
              "               .max_chunks = max_chunks,\n"
              "               .target_in_flight = target_in_flight,\n"
              "            },\n"
              "         };\n"
              "         if (pan_kmod_ioctl(dev->fd, KBASE_IOCTL_CS_TILER_HEAP_INIT_V1_13, &req_legacy)) {\n"
              '            mesa_loge("kbase: CS_TILER_HEAP_INIT (legacy) failed (err=%d)", errno);\n'
              "            return false;\n"
              "         }\n"
              "         *heap_ctx_va = req_legacy.out.gpu_heap_va;\n"
              "         *first_chunk_va = req_legacy.out.first_chunk_va;\n"
              "         return true;\n"
              "      }\n"
              '      mesa_loge("kbase: CS_TILER_HEAP_INIT failed (err=%d)", errno);\n'
              "      return false;\n"
              "   }\n"
              "   *heap_ctx_va = req.out.gpu_heap_va;\n"
              "   *first_chunk_va = req.out.first_chunk_va;"
          )
          assert old_func in src, "Expected CS_TILER_HEAP_INIT call block not found"
          src = src.replace(old_func, new_func, 1)

          # 2. Fallback para CS_QUEUE_GROUP_CREATE (112B ioctl 58 -> 40B ioctl 58 -> 32B ioctl 42)
          old_gc_ioctl = (
              "#define KBASE_IOCTL_CS_QUEUE_GROUP_CREATE                                                         \\\n"
              "   _IOWR(KBASE_IOCTL_TYPE, 58, union kbase_ioctl_cs_queue_group_create)"
          )
          new_gc_ioctl = (
              "union kbase_ioctl_cs_queue_group_create_v40 {\n"
              "   struct {\n"
              "      uint64_t tiler_mask;\n"
              "      uint64_t fragment_mask;\n"
              "      uint64_t compute_mask;\n"
              "      uint8_t cs_min;\n"
              "      uint8_t priority;\n"
              "      uint8_t tiler_max;\n"
              "      uint8_t fragment_max;\n"
              "      uint8_t compute_max;\n"
              "      uint8_t csi_handlers;\n"
              "      uint8_t padding[2];\n"
              "      uint64_t reserved;\n"
              "   } in;\n"
              "   struct {\n"
              "      uint8_t group_handle;\n"
              "      uint8_t padding[3];\n"
              "      uint32_t group_uid;\n"
              "   } out;\n"
              "};\n\n"
              "union kbase_ioctl_cs_queue_group_create_1_6 {\n"
              "   struct {\n"
              "      uint64_t tiler_mask;\n"
              "      uint64_t fragment_mask;\n"
              "      uint64_t compute_mask;\n"
              "      uint8_t cs_min;\n"
              "      uint8_t priority;\n"
              "      uint8_t tiler_max;\n"
              "      uint8_t fragment_max;\n"
              "      uint8_t compute_max;\n"
              "      uint8_t padding[3];\n"
              "   } in;\n"
              "   struct {\n"
              "      uint8_t group_handle;\n"
              "      uint8_t padding[3];\n"
              "      uint32_t group_uid;\n"
              "   } out;\n"
              "};\n\n"
              "#define KBASE_IOCTL_CS_QUEUE_GROUP_CREATE_V40                                                     \\\n"
              "   _IOWR(KBASE_IOCTL_TYPE, 58, union kbase_ioctl_cs_queue_group_create_v40)\n"
              "#define KBASE_IOCTL_CS_QUEUE_GROUP_CREATE_1_6                                                     \\\n"
              "   _IOWR(KBASE_IOCTL_TYPE, 42, union kbase_ioctl_cs_queue_group_create_1_6)\n\n"
              + old_gc_ioctl
          )
          assert old_gc_ioctl in src, "Expected KBASE_IOCTL_CS_QUEUE_GROUP_CREATE block not found"
          src = src.replace(old_gc_ioctl, new_gc_ioctl, 1)

          old_gc_call = (
              "   if (pan_kmod_ioctl(dev->fd, KBASE_IOCTL_CS_QUEUE_GROUP_CREATE, &gc)) {\n"
              '      mesa_loge("kbase: CS_QUEUE_GROUP_CREATE failed (err=%d)", errno);\n'
              "      goto err_free_seq;\n"
              "   }\n"
              "   g->handle = gc.out.group_handle;"
          )
          new_gc_call = (
              "   uint8_t group_handle = 0;\n"
              "   if (pan_kmod_ioctl(dev->fd, KBASE_IOCTL_CS_QUEUE_GROUP_CREATE, &gc)) {\n"
              "      if (errno == ENOTTY) {\n"
              "         union kbase_ioctl_cs_queue_group_create_v40 gc40 = {\n"
              "            .in = {\n"
              "               .tiler_mask = 1,\n"
              "               .fragment_mask = fragment_mask,\n"
              "               .compute_mask = compute_mask,\n"
              "               .cs_min = nr_queues,\n"
              "               .priority = priority,\n"
              "               .tiler_max = 1,\n"
              "               .fragment_max = max_fragment,\n"
              "               .compute_max = max_compute,\n"
              "            },\n"
              "         };\n"
              "         union kbase_ioctl_cs_queue_group_create_1_6 gc32 = {\n"
              "            .in = {\n"
              "               .tiler_mask = 1,\n"
              "               .fragment_mask = fragment_mask,\n"
              "               .compute_mask = compute_mask,\n"
              "               .cs_min = nr_queues,\n"
              "               .priority = priority,\n"
              "               .tiler_max = 1,\n"
              "               .fragment_max = max_fragment,\n"
              "               .compute_max = max_compute,\n"
              "            },\n"
              "         };\n"
              "         if (!pan_kmod_ioctl(dev->fd, KBASE_IOCTL_CS_QUEUE_GROUP_CREATE_V40, &gc40)) {\n"
              "            group_handle = gc40.out.group_handle;\n"
              "         } else if (errno == ENOTTY && !pan_kmod_ioctl(dev->fd, KBASE_IOCTL_CS_QUEUE_GROUP_CREATE_1_6, &gc32)) {\n"
              "            group_handle = gc32.out.group_handle;\n"
              "         } else {\n"
              '            mesa_loge("kbase: CS_QUEUE_GROUP_CREATE (fallback) failed (err=%d)", errno);\n'
              "            goto err_free_seq;\n"
              "         }\n"
              "      } else {\n"
              '         mesa_loge("kbase: CS_QUEUE_GROUP_CREATE failed (err=%d)", errno);\n'
              "         goto err_free_seq;\n"
              "      }\n"
              "   } else {\n"
              "      group_handle = gc.out.group_handle;\n"
              "   }\n"
              "   g->handle = group_handle;"
          )
          assert old_gc_call in src, "Expected CS_QUEUE_GROUP_CREATE call block not found"
          src = src.replace(old_gc_call, new_gc_call, 1)

          # 3. Máscara real de scoreboards (8 slots = 0xff en G610, 16 slots = 0xffff en G720)
          old_sb = (
              "      kbase_csf_emit(r, cs_ins(CS_OP_MOVE32, V << 48));\n"
              "      kbase_csf_emit(r, cs_ins(CS_OP_FLUSH_CACHE2,\n"
              "                               (V << 40) | (0xffffull << 16) | (1u << 4) | 1u)); /* clean */\n"
              "      kbase_csf_emit(r, cs_ins(CS_OP_WAIT, 0xffffull << 16));"
          )
          new_sb = (
              "      const uint64_t sb_all = BITFIELD_MASK(MIN2(kdev->csif.scoreboard_slot_count, 16));\n"
              "      kbase_csf_emit(r, cs_ins(CS_OP_MOVE32, V << 48));\n"
              "      kbase_csf_emit(r, cs_ins(CS_OP_FLUSH_CACHE2,\n"
              "                               (V << 40) | (sb_all << 16) | (1u << 4) | 1u)); /* clean */\n"
              "      kbase_csf_emit(r, cs_ins(CS_OP_WAIT, sb_all << 16));"
          )
          assert old_sb in src, "Expected scoreboard wait mask block not found"
          src = src.replace(old_sb, new_sb, 1)

          p.write_text(src)
          print("Successfully patched kbase_kmod.c (all 3 patches)")
          PY

      - name: Build Android PanVK driver & package zip
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
          ANDROID_NDK_ROOT: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |
          echo "Using NDK: ${{ steps.setup-ndk.outputs.ndk-path }}"
          chmod +x build.sh
          ./build.sh "${{ steps.setup-ndk.outputs.ndk-path }}"

      - name: Prepare driver files for single-zip artifact
        run: |
          mkdir -p dist/artifact
          unzip -o dist/*.zip -d dist/artifact

      - name: Upload compiled driver zip
        uses: actions/upload-artifact@v4
        with:
          name: mali-panvk-dimensity7030-fixed
          path: dist/artifact/

name: Build PanVK Mali (Dimensity 7030 / kbase patch)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install host build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            meson ninja-build pkg-config glslang-tools \
            python3-mako python3-packaging python3-yaml \
            clang llvm-dev libclang-dev libclc-18-dev libllvmspirvlib-18-dev \
            bison flex patchelf zip unzip curl
          if [ "$(meson --version | cut -d. -f2)" -lt 4 ]; then
            pip3 install --break-system-packages --upgrade "meson>=1.4.0"
          fi

      - name: Setup Android NDK r29
        id: setup-ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r29
          add-to-path: false

      - name: Patch CSF kbase for Mali-G610 / Dimensity 7030
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path("src/panfrost/lib/kmod/kbase_kmod.c")
          s = p.read_text()

          def sub(old, new):
              global s
              assert s.count(old) == 1, f"Match count {s.count(old)} for {old[:50]!r}"
              s = s.replace(old, new, 1)

          # 1. CS_TILER_HEAP_INIT (24B -> 16B v1.13)
          sub(
              "#define KBASE_IOCTL_CS_TILER_HEAP_INIT                                                            \\\n"
              "   _IOWR(KBASE_IOCTL_TYPE, 48, union kbase_ioctl_cs_tiler_heap_init)",
              "union kbase_ioctl_cs_tiler_heap_init_v1_13 {\n"
              "   struct { uint32_t chunk_size, initial_chunks, max_chunks; uint16_t target_in_flight; uint8_t group_id, padding; } in;\n"
              "   struct { uint64_t gpu_heap_va, first_chunk_va; } out;\n"
              "};\n"
              "#define KBASE_IOCTL_CS_TILER_HEAP_INIT_V1_13 _IOWR(KBASE_IOCTL_TYPE, 48, union kbase_ioctl_cs_tiler_heap_init_v1_13)\n"
              "#define KBASE_IOCTL_CS_TILER_HEAP_INIT _IOWR(KBASE_IOCTL_TYPE, 48, union kbase_ioctl_cs_tiler_heap_init)"
          )
          sub(
              "   if (pan_kmod_ioctl(dev->fd, KBASE_IOCTL_CS_TILER_HEAP_INIT, &req)) {\n"
              '      mesa_loge("kbase: CS_TILER_HEAP_INIT failed (err=%d)", errno);\n'
              "      return false;\n"
              "   }",
              "   if (pan_kmod_ioctl(dev->fd, KBASE_IOCTL_CS_TILER_HEAP_INIT, &req)) {\n"
              "      if (errno == ENOTTY) {\n"
              "         union kbase_ioctl_cs_tiler_heap_init_v1_13 r13 = {.in = {\n"
              "            .chunk_size = chunk_size, .initial_chunks = initial_chunks,\n"
              "            .max_chunks = max_chunks, .target_in_flight = target_in_flight}};\n"
              "         if (pan_kmod_ioctl(dev->fd, KBASE_IOCTL_CS_TILER_HEAP_INIT_V1_13, &r13)) {\n"
              '            mesa_loge("kbase: CS_TILER_HEAP_INIT (legacy) failed (err=%d)", errno); return false;\n'
              "         }\n"
              "         *heap_ctx_va = r13.out.gpu_heap_va; *first_chunk_va = r13.out.first_chunk_va; return true;\n"
              "      }\n"
              '      mesa_loge("kbase: CS_TILER_HEAP_INIT failed (err=%d)", errno); return false;\n'
              "   }"
          )

          # 2. CS_QUEUE_GROUP_CREATE (112B ioctl 58 -> 40B ioctl 58 -> 32B ioctl 42)
          sub(
              "#define KBASE_IOCTL_CS_QUEUE_GROUP_CREATE                                                         \\\n"
              "   _IOWR(KBASE_IOCTL_TYPE, 58, union kbase_ioctl_cs_queue_group_create)",
              "union kbase_ioctl_cs_queue_group_create_v40 {\n"
              "   struct { uint64_t tiler_mask, fragment_mask, compute_mask; uint8_t cs_min, priority, tiler_max, fragment_max, compute_max, csi_handlers, padding[2]; uint64_t reserved; } in;\n"
              "   struct { uint8_t group_handle, padding[3]; uint32_t group_uid; } out;\n"
              "};\n"
              "union kbase_ioctl_cs_queue_group_create_1_6 {\n"
              "   struct { uint64_t tiler_mask, fragment_mask, compute_mask; uint8_t cs_min, priority, tiler_max, fragment_max, compute_max, padding[3]; } in;\n"
              "   struct { uint8_t group_handle, padding[3]; uint32_t group_uid; } out;\n"
              "};\n"
              "#define KBASE_IOCTL_CS_QUEUE_GROUP_CREATE_V40 _IOWR(KBASE_IOCTL_TYPE, 58, union kbase_ioctl_cs_queue_group_create_v40)\n"
              "#define KBASE_IOCTL_CS_QUEUE_GROUP_CREATE_1_6 _IOWR(KBASE_IOCTL_TYPE, 42, union kbase_ioctl_cs_queue_group_create_1_6)\n"
              "#define KBASE_IOCTL_CS_QUEUE_GROUP_CREATE _IOWR(KBASE_IOCTL_TYPE, 58, union kbase_ioctl_cs_queue_group_create)"
          )
          sub(
              "   if (pan_kmod_ioctl(dev->fd, KBASE_IOCTL_CS_QUEUE_GROUP_CREATE, &gc)) {\n"
              '      mesa_loge("kbase: CS_QUEUE_GROUP_CREATE failed (err=%d)", errno);\n'
              "      goto err_free_seq;\n"
              "   }\n"
              "   g->handle = gc.out.group_handle;",
              "   uint8_t gh = 0;\n"
              "   if (pan_kmod_ioctl(dev->fd, KBASE_IOCTL_CS_QUEUE_GROUP_CREATE, &gc)) {\n"
              "      if (errno == ENOTTY) {\n"
              "         union kbase_ioctl_cs_queue_group_create_v40 g40 = {.in = {.tiler_mask = 1, .fragment_mask = fragment_mask, .compute_mask = compute_mask, .cs_min = nr_queues, .priority = priority, .tiler_max = 1, .fragment_max = max_fragment, .compute_max = max_compute}};\n"
              "         union kbase_ioctl_cs_queue_group_create_1_6 g32 = {.in = {.tiler_mask = 1, .fragment_mask = fragment_mask, .compute_mask = compute_mask, .cs_min = nr_queues, .priority = priority, .tiler_max = 1, .fragment_max = max_fragment, .compute_max = max_compute}};\n"
              "         if (!pan_kmod_ioctl(dev->fd, KBASE_IOCTL_CS_QUEUE_GROUP_CREATE_V40, &g40)) gh = g40.out.group_handle;\n"
              "         else if (errno == ENOTTY && !pan_kmod_ioctl(dev->fd, KBASE_IOCTL_CS_QUEUE_GROUP_CREATE_1_6, &g32)) gh = g32.out.group_handle;\n"
              '         else { mesa_loge("kbase: CS_QUEUE_GROUP_CREATE (fallback) failed (err=%d)", errno); goto err_free_seq; }\n'
              '      } else { mesa_loge("kbase: CS_QUEUE_GROUP_CREATE failed (err=%d)", errno); goto err_free_seq; }\n'
              "   } else gh = gc.out.group_handle;\n"
              "   g->handle = gh;"
          )

          # 3. Scoreboards reales (0xff en G610, 0xffff en G720)
          sub(
              "      kbase_csf_emit(r, cs_ins(CS_OP_FLUSH_CACHE2,\n"
              "                               (V << 40) | (0xffffull << 16) | (1u << 4) | 1u)); /* clean */\n"
              "      kbase_csf_emit(r, cs_ins(CS_OP_WAIT, 0xffffull << 16));",
              "      const uint64_t sb_all = BITFIELD_MASK(MIN2(kdev->csif.scoreboard_slot_count, 16));\n"
              "      kbase_csf_emit(r, cs_ins(CS_OP_FLUSH_CACHE2, (V << 40) | (sb_all << 16) | (1u << 4) | 1u));\n"
              "      kbase_csf_emit(r, cs_ins(CS_OP_WAIT, sb_all << 16));"
          )

          # 4. MEM_EXEC_INIT antes de MEM_JIT_INIT + BASE_MEM_NEED_MMAP
          sub(
              "      if (vc.major == 1) {\n"
              "         struct kbase_ioctl_mem_jit_init jit = {\n"
              "            .va_pages = KBASE_CSF_JIT_VA_PAGES,\n"
              "            .max_allocations = 255,\n"
              "            .phys_pages = KBASE_CSF_JIT_VA_PAGES,\n"
              "         };\n"
              "         if (pan_kmod_ioctl(fd, KBASE_IOCTL_MEM_JIT_INIT, &jit))\n"
              '            mesa_logw("kbase: MEM_JIT_INIT failed (err=%d); no tiler heap", errno);\n'
              "      }\n"
              "      if (pan_kmod_ioctl(fd, KBASE_IOCTL_MEM_EXEC_INIT, &ei))\n"
              '         mesa_logw("kbase: MEM_EXEC_INIT failed (err=%d); executable BOs will be SAME_VA", errno);',
              "      if (pan_kmod_ioctl(fd, KBASE_IOCTL_MEM_EXEC_INIT, &ei))\n"
              '         mesa_logw("kbase: MEM_EXEC_INIT failed (err=%d); executable BOs will be SAME_VA", errno);\n'
              "      if (vc.major == 1) {\n"
              "         struct kbase_ioctl_mem_jit_init jit = {.va_pages = KBASE_CSF_JIT_VA_PAGES, .max_allocations = 255, .phys_pages = KBASE_CSF_JIT_VA_PAGES};\n"
              "         if (pan_kmod_ioctl(fd, KBASE_IOCTL_MEM_JIT_INIT, &jit))\n"
              '            mesa_logw("kbase: MEM_JIT_INIT failed (err=%d); no tiler heap", errno);\n'
              "      }"
          )
          sub(
              "   bo->exec = exec;\n   bo->anchor = NULL;\n\n   if (exec) {",
              "   const bool need_mmap = (req.out.flags & BASE_MEM_NEED_MMAP) != 0;\n"
              "   bo->exec = exec && !need_mmap;\n   bo->anchor = NULL;\n\n   if (bo->exec) {"
          )

          # 5a. Conservar csf_group/csf_seq en ks_transfer y esperar por CSF en ks_export_sync_file
          sub(
              "      d->external = s->external;\n      pthread_cond_broadcast(&ks_cond);",
              "      d->external = s->external; d->csf_group = s->csf_group; d->csf_seq = s->csf_seq;\n      pthread_cond_broadcast(&ks_cond);"
          )
          sub(
              "      /* Submitted without a sync file: all that is left is to wait for the GPU. */\n"
              "      ret = ks_wait_locked(&handle, 1, deadline, 0, NULL);",
              "      if (!o->external && o->csf_group && o->csf_seq) {\n"
              "         struct pan_kmod_kbase_csf_group *cg = (struct pan_kmod_kbase_csf_group *)o->csf_group;\n"
              "         const uint64_t cs = o->csf_seq;\n"
              "         pthread_mutex_unlock(&ks_lock);\n"
              '         if (!pan_kmod_kbase_csf_wait(cg, cs, (int64_t)deadline)) { mesa_loge("kbase: export CSF wait timeout (seq %" PRIu64 ")", cs); return ks_ret(-ETIME); }\n'
              "         *out_fd = -1; return 0;\n"
              "      }\n"
              "      ret = ks_wait_locked(&handle, 1, deadline, 0, NULL);"
          )

          # 5b. Watchdog 5s para esperas infinitas INT64_MAX en ks_wait_locked y pan_kmod_kbase_csf_wait
          sub(
              "   const bool available = flags & DRM_SYNCOBJ_WAIT_FLAGS_WAIT_AVAILABLE;\n\n   for (;;) {",
              "   const bool available = flags & DRM_SYNCOBJ_WAIT_FLAGS_WAIT_AVAILABLE;\n"
              "   uint64_t next_log = timeout_nsec == INT64_MAX ? ks_now() + 5000000000ull : 0;\n\n   for (;;) {"
          )
          sub(
              "      if (external) {",
              "      if (timeout_nsec == INT64_MAX && ks_now() >= next_log) {\n"
              "         struct ks_obj *o0 = n ? ks_get(handles[0]) : NULL;\n"
              '         mesa_loge("kbase ks_wait >5s: n=%u done=%u flags=0x%x o0(state=%u ext=%d fd=%d seq=%" PRIu64 ")",\n'
              "                   n, done, flags, o0 ? (unsigned)o0->state : 255u, o0 ? (int)o0->external : 0, o0 ? o0->fd : -1, o0 ? o0->csf_seq : (uint64_t)0);\n"
              "         next_log = ks_now() + 5000000000ull;\n"
              "      }\n"
              "      if (external) {"
          )
          sub(
              "      } else if (timeout_nsec == INT64_MAX) {\n         pthread_cond_wait(&ks_cond, &ks_lock);",
              "      } else if (timeout_nsec == INT64_MAX) {\n"
              "         const struct timespec ts = {.tv_sec = next_log / 1000000000ull, .tv_nsec = next_log % 1000000000ull};\n"
              "         pthread_cond_timedwait(&ks_cond, &ks_lock, &ts);"
          )
          sub(
              "pan_kmod_kbase_csf_wait(struct pan_kmod_kbase_csf_group *g, uint64_t seq, int64_t abs_timeout_ns)\n"
              "{\n"
              "   struct kbase_csf_dev *c = g->kdev->csfq;\n"
              "   bool done = false;",
              "pan_kmod_kbase_csf_wait(struct pan_kmod_kbase_csf_group *g, uint64_t seq, int64_t abs_timeout_ns)\n"
              "{\n"
              "   struct kbase_csf_dev *c = g->kdev->csfq;\n"
              "   bool done = false; int64_t next_log_ns = 0;"
          )
          sub(
              "      if (abs_timeout_ns == INT64_MAX) {\n"
              "         pthread_cond_wait(&c->cond, &c->lock);\n"
              "         continue;\n"
              "      }\n"
              "      struct timespec now;\n"
              "      clock_gettime(CLOCK_MONOTONIC, &now);\n"
              "      if ((int64_t)now.tv_sec * 1000000000ll + now.tv_nsec >= abs_timeout_ns)\n"
              "         break;\n"
              "      const struct timespec until = {.tv_sec = abs_timeout_ns / 1000000000ll,\n"
              "                                     .tv_nsec = abs_timeout_ns % 1000000000ll};",
              "      struct timespec now; clock_gettime(CLOCK_MONOTONIC, &now);\n"
              "      const int64_t now_ns = (int64_t)now.tv_sec * 1000000000ll + now.tv_nsec;\n"
              "      if (abs_timeout_ns != INT64_MAX && now_ns >= abs_timeout_ns) break;\n"
              "      int64_t wait_ns = abs_timeout_ns;\n"
              "      if (abs_timeout_ns == INT64_MAX) {\n"
              "         if (!next_log_ns) next_log_ns = now_ns + 5000000000ll;\n"
              "         if (now_ns >= next_log_ns) {\n"
              '            mesa_loge("kbase csf_wait >5s: grp=%u want=%" PRIu64 " done=%" PRIu64 " subs=%u flt=%d q0=%" PRIu64 "/%" PRIu64 " q1=%" PRIu64 "/%" PRIu64,\n'
              "                      g->handle, seq, g->done_seq, g->nr_subs, g->faulted,\n"
              "                      (uint64_t)g->seqno[0], g->ring[0].insert, (uint64_t)g->seqno[8], g->ring[1].insert);\n"
              "            next_log_ns = now_ns + 5000000000ll;\n"
              "         }\n"
              "         wait_ns = next_log_ns;\n"
              "      }\n"
              "      const struct timespec until = {.tv_sec = wait_ns / 1000000000ll, .tv_nsec = wait_ns % 1000000000ll};"
          )

          # 5c. Desactivar KCPU_QUEUE fence_fd (evita freeze negro en SurfaceFlinger)
          i = s.index("int\npan_kmod_kbase_csf_fence_fd(struct pan_kmod_kbase_csf_group *g, uint64_t seq)\n{")
          j = s.index("\nbool\npan_kmod_kbase_csf_group_faulted(")
          s = s[:i] + "int\npan_kmod_kbase_csf_fence_fd(struct pan_kmod_kbase_csf_group *g, uint64_t seq)\n{\n   (void)g; (void)seq; return -1;\n}\n" + s[j:]

          p.write_text(s)

          # 6. Gralloc Dimensity 7030: forzar linear (SW_READ/WRITE) + layout {17,2,3,4}
          def rep(path, old, new):
              fp = Path(path)
              txt = fp.read_text()
              assert txt.count(old) == 1, f"{path}: count={txt.count(old)} for {old[:40]!r}"
              fp.write_text(txt.replace(old, new, 1))

          rep("src/panfrost/vulkan/panvk_android.h",
              "#define GRALLOC_USAGE_HW_COMPOSER  (1u << 11)",
              "#define GRALLOC_USAGE_HW_COMPOSER  (1u << 11)\n"
              "#define PANVK_GRALLOC_SW_READ      (1u << 1)\n"
              "#define PANVK_GRALLOC_SW_WRITE     (1u << 5)")
          rep("src/panfrost/vulkan/panvk_android.c",
              "*grallocUsage |= MALI_GRALLOC_USAGE_NO_AFBC | GRALLOC_USAGE_HW_COMPOSER;",
              "*grallocUsage |= MALI_GRALLOC_USAGE_NO_AFBC | GRALLOC_USAGE_HW_COMPOSER | PANVK_GRALLOC_SW_READ | PANVK_GRALLOC_SW_WRITE;")
          rep("src/panfrost/vulkan/panvk_android.c",
              "      *grallocProducerUsage |= MALI_GRALLOC_USAGE_NO_AFBC;\n"
              "      *grallocConsumerUsage |= GRALLOC_USAGE_HW_COMPOSER;",
              "      *grallocProducerUsage |= MALI_GRALLOC_USAGE_NO_AFBC | PANVK_GRALLOC_SW_WRITE;\n"
              "      *grallocConsumerUsage |= GRALLOC_USAGE_HW_COMPOSER | PANVK_GRALLOC_SW_READ;")
          rep("src/panfrost/vulkan/panvk_physical_device.c",
              "MALI_GRALLOC_USAGE_NO_AFBC | GRALLOC_USAGE_HW_COMPOSER;",
              "MALI_GRALLOC_USAGE_NO_AFBC | GRALLOC_USAGE_HW_COMPOSER | PANVK_GRALLOC_SW_READ | PANVK_GRALLOC_SW_WRITE;")
          rep("src/util/u_gralloc/u_gralloc_fallback.c",
              "   {16, 1, 2, 3}, /* MediaTek, Android 17 */",
              "   {16, 1, 2, 3}, /* MediaTek, Android 17 */\n   {17, 2, 3, 4}, /* MediaTek, Android 15 */")
          print("Successfully patched kbase_kmod.c + gralloc linear/MTK3 (all 6 patches)")
          PY

      - name: Build Android PanVK driver & package zip
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
          ANDROID_NDK_ROOT: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |
          echo "Using NDK: ${{ steps.setup-ndk.outputs.ndk-path }}"
          chmod +x build.sh
          ./build.sh "${{ steps.setup-ndk.outputs.ndk-path }}"

      - name: Prepare driver files for single-zip artifact
        run: |
          mkdir -p dist/artifact
          unzip -o dist/*.zip -d dist/artifact

      - name: Upload compiled driver zip
        uses: actions/upload-artifact@v4
        with:
          name: mali-panvk-dimensity7030-fixed
          path: dist/artifact/
